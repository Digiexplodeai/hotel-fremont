[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# Redirect non-www hotelfremont.in to www.hotelfremont.in (Permanent 301)
[[redirects]]
  from = "https://hotelfremont.in/*"
  to = "https://www.hotelfremont.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://hotelfremont.in/*"
  to = "https://www.hotelfremont.in/:splat"
  status = 301
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache headers for static media
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

